name: Контракт Humanizer

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/scripts/humanizer_review.py'
      - '.github/workflows/humanizer-*.yml'
      - 'docs/HUMANIZER_REVIEW.md'
  pull_request:
    paths:
      - '.github/scripts/humanizer_review.py'
      - '.github/workflows/humanizer-*.yml'
      - 'docs/HUMANIZER_REVIEW.md'

permissions:
  contents: read

env:
  HUMANIZER_RUSSIAN_SHA: 81af17bcb18ae9364a9f94f4e2f849a68d3b1eee
  HUMANIZER_SERBIAN_SHA: ebf49b929f4f6c75b2e7e5a8814ff0f17a4f46ab

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test syntax and prose-only adapter
        run: |
          python3 -m py_compile .github/scripts/humanizer_review.py
          python3 .github/scripts/humanizer_review.py --self-test
      - name: Fetch pinned language editors
        run: |
          git init /tmp/humanizer_russian
          git -C /tmp/humanizer_russian remote add origin https://github.com/Antiokh/humanizer_russian.git
          git -C /tmp/humanizer_russian fetch --depth=1 origin "$HUMANIZER_RUSSIAN_SHA"
          git -C /tmp/humanizer_russian checkout --detach FETCH_HEAD
          test "$(git -C /tmp/humanizer_russian rev-parse HEAD)" = "$HUMANIZER_RUSSIAN_SHA"
          git init /tmp/humanizer_serbian
          git -C /tmp/humanizer_serbian remote add origin https://github.com/Antiokh/humanizer_serbian.git
          git -C /tmp/humanizer_serbian fetch --depth=1 origin "$HUMANIZER_SERBIAN_SHA"
          git -C /tmp/humanizer_serbian checkout --detach FETCH_HEAD
          test "$(git -C /tmp/humanizer_serbian rev-parse HEAD)" = "$HUMANIZER_SERBIAN_SHA"
      - name: Test both reviewer APIs
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("svesnost_review", ".github/scripts/humanizer_review.py")
          adapter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adapter)
          ru = adapter.load_module(Path("/tmp/humanizer_russian"), "scripts/review.py", "humanizer_ru_contract")
          report = ru.run_review("Здесь обычное проверочное предложение на русском языке.", style_id="neutral", evidence_ids=None, register="general")
          assert isinstance(report["findings"], list)
          sr = adapter.load_module(Path("/tmp/humanizer_serbian"), "scripts/check.py", "humanizer_sr_contract")
          assert isinstance(sr.review("Ово је обичан проверни текст на српском језику."), list)
          assert isinstance(adapter.russian_new(ru, "", "Здесь другое короткое предложение."), list)
          assert isinstance(adapter.serbian_new(sr, "", "Ово је још једна проверна реченица."), list)
          print("Language editor APIs: OK")
          PY
