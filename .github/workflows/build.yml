name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write # Temporary: capture generated npm lockfile on this PR branch only.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Check language isolation
        run: npm run test:i18n
      - name: Browser checks (mobile and desktop)
        run: npm run test:ui
      - name: Commit generated lockfile to PR branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/mobile-navigation-controls'
        run: |
          test -s package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm dependency graph"
            git push origin HEAD:agent/mobile-navigation-controls
          fi
