name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check structured content model
        run: npm run test:model
      - name: Build static site
        run: npm run build
      - name: Check language isolation
        run: npm run test:i18n
      - name: Browser checks (mobile and desktop)
        run: npm run test:ui
